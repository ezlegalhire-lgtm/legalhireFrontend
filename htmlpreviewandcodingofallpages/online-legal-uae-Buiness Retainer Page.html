<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Online Legal UAE — Legal Retainers</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                accent: '#6B21A8', /* rich purple */
              },
            },
            boxShadow: {
              soft: '0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06)',
              glow: '0 10px 30px rgba(123,47,247,0.25)',
            },
            borderRadius: {
              xl2: '14px'
            }
          }
        }
      }
    </script>
    <style>
      :root{
        --grad: linear-gradient(90deg, #7B2FF7 0%, #F107A3 100%);
      }
      html, body { background:#f8fafc }
      body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji","Segoe UI Emoji"; }
      .poppins { font-family: Poppins, Inter, ui-sans-serif; }
      .gradient-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .gradient-bg { background: var(--grad); }
      /* Micro animations */
      .reveal { opacity: 0; transform: translateY(12px); transition: opacity .5s ease, transform .5s ease; }
      .reveal.in { opacity: 1; transform: none; }
      .btn-glow:hover { box-shadow: 0 10px 30px rgba(123,47,247,0.35); }
      /* Simple chat popover */
      .chat-pop { animation: pop .15s ease-out; }
      @keyframes pop { from { transform: scale(.98); opacity:.7 } to { transform: scale(1); opacity:1 } }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React 18 -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const BRAND = {
        gradient: 'linear-gradient(90deg, #7B2FF7 0%, #F107A3 100%)',
        accent: '#6B21A8',
      };

      const Section = ({children, className=''}) => (
        <section className={"max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 " + className}>{children}</section>
      );

      const Badge = ({ children, tone='neutral' }) => {
        const map = {
          neutral: 'bg-slate-100 text-slate-700',
          good: 'bg-emerald-50 text-emerald-700',
          warn: 'bg-amber-50 text-amber-700',
          brand: 'text-white',
        };
        const base = 'px-2 py-1 rounded-full text-xs';
        return (
          <span className={base + ' ' + (tone==='brand' ? '' : map[tone])} style={tone==='brand'? {background: BRAND.gradient} : {}}>
            {children}
          </span>
        );
      };

      const PlanCard = ({plan, onSelect}) => (
        <div data-reveal className={"rounded-2xl border " + (plan.highlight ? "border-transparent shadow-glow" : "border-slate-200 shadow-soft")}
             style={plan.highlight ? { background: 'linear-gradient(white, white) padding-box, ' + BRAND.gradient + ' border-box' } : { background:'#fff' }}>
          <div className="p-6">
            <div className="flex items-start justify-between">
              <div>
                <h3 className="text-lg font-semibold text-slate-900 poppins">{plan.name}</h3>
                <p className="text-sm text-slate-600">{plan.badge}</p>
              </div>
              {plan.highlight && <Badge tone="brand">Best Value</Badge>}
            </div>
            <p className="text-3xl font-extrabold mt-4 poppins gradient-text">{plan.price}</p>
            <ul className="mt-4 space-y-2 text-sm text-slate-700">
              {plan.features.map((f,i)=>(
                <li key={i} className="flex items-start gap-2"><span>✔</span><span>{f}</span></li>
              ))}
            </ul>
            <button onClick={() => onSelect(plan.name)} className="mt-5 w-full rounded-lg px-4 py-2.5 text-sm font-semibold text-white hover:opacity-95 btn-glow" style={{ background: BRAND.accent }}>
              {plan.cta}
            </button>
          </div>
        </div>
      );

      const ComparisonTable = () => {
        const rows = [
          ['Dedicated CRM Dashboard','✅ Included','❌ None','⚠️ Limited'],
          ['Retainer Hour Tracking','✅ Live tracker','❌ Manual invoices','⚠️ Approximate'],
          ['Integrated Video Meetings','✅ Built-in','⚠️ Separate apps','⚠️ Limited'],
          ['Document Vault & E‑Sign','✅ Secure uploads & signing','⚠️ Manual exchange','⚠️ Some'],
          ['Transparent Monthly Pricing','✅ Fixed packages','❌ Hourly rates','⚠️ Hidden fees'],
          ['Dedicated Account Manager','✅ Yes','⚠️ Optional','❌ None'],
          ['Client Chat & Notifications','✅ Built-in chat','❌ Phone/email only','⚠️ Partial'],
          ['AI Document Automation','✅ Yes','❌ None','⚠️ Limited'],
          ['UAE Law Expertise','✅ Licensed locally','✅','⚠️ Outsourced'],
          ['Calendar & Meeting Sync','✅ Google/Outlook','❌ Manual','⚠️ External tools'],
          ['Confidential UAE Hosting','✅ Yes','⚠️ Variable','❌ No guarantee'],
        ];
        return (
          <div data-reveal className="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-soft">
            <table className="w-full text-sm">
              <thead className="text-slate-700">
                <tr>
                  <th className="text-left px-4 py-3 bg-slate-50">Feature</th>
                  <th className="text-left px-4 py-3" style={{background: BRAND.gradient, color:'white'}}>Online Legal UAE</th>
                  <th className="text-left px-4 py-3 bg-slate-50">Traditional Firms</th>
                  <th className="text-left px-4 py-3 bg-slate-50">Other Portals</th>
                </tr>
              </thead>
              <tbody>
                {rows.map((r,i)=>(
                  <tr key={i} className="border-t border-slate-100">
                    <td className="px-4 py-3 text-slate-800">{r[0]}</td>
                    <td className="px-4 py-3 font-semibold text-emerald-700">{r[1]}</td>
                    <td className="px-4 py-3 text-slate-600">{r[2]}</td>
                    <td className="px-4 py-3 text-slate-600">{r[3]}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      };

      const FeatureGrid = () => {
        const items = [
          {t:'Smart Retainer CRM', d:'Track hours, invoices, and deliverables in real time.'},
          {t:'Calendar & Meetings', d:'Schedule consultations instantly with calendar sync.'},
          {t:'Secure Document Vault', d:'Upload, review, and e-sign documents securely.'},
          {t:'Licensed UAE Lawyers', d:'Verified advocates and consultants on one portal.'},
          {t:'24/7 Client Chat', d:'Direct chat with your lawyer & notification center.'},
          {t:'Transparent Hour Tracking', d:'See used vs remaining hours — zero surprises.'},
          {t:'Virtual Legal Department', d:'Your cloud-based alternative to in-house teams.'},
          {t:'AI Drafting (beta)', d:'Faster first drafts; lawyers finalize for accuracy.'},
        ];
        return (
          <div data-reveal className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
            {items.map((it,i)=>(
              <div key={i} className="border border-slate-200 rounded-2xl bg-white p-5 shadow-soft">
                <div className="h-10 w-10 rounded-full gradient-bg grid place-items-center text-white font-semibold shadow-glow mb-3">★</div>
                <p className="font-semibold text-slate-900">{it.t}</p>
                <p className="text-sm text-slate-600 mt-1">{it.d}</p>
              </div>
            ))}
          </div>
        );
      };

      /* NEW: Trust Section */
      const TrustSection = () => {
        const logos = ['Noor Group','Emirates HR','Dubai Foods','GreenTech','Al Futtaim (ex.)','Ras Al Khaimah (ex.)'];
        const badges = ['Licensed UAE Lawyers','ISO 27001 Security','UAE Data Hosting','Secure Payments'];
        return (
          <Section className="py-10">
            <div data-reveal className="text-center mb-6">
              <h3 className="text-2xl font-extrabold poppins text-slate-900">Trusted by UAE Businesses</h3>
              <p className="text-slate-600">Your data stays in UAE — never shared overseas.</p>
            </div>
            <div data-reveal className="flex flex-wrap justify-center gap-4 md:gap-6">
              {logos.map((c,i)=>(
                <div key={i} className="px-5 py-3 border border-slate-200 rounded-xl bg-white shadow-soft text-slate-700">{c}</div>
              ))}
            </div>
            <div data-reveal className="mt-6 flex flex-wrap justify-center gap-3 text-sm text-slate-700">
              {badges.map((b,i)=>(<span key={i} className="px-3 py-1 border rounded-full bg-white shadow-soft">{b}</span>))}
            </div>
          </Section>
        );
      };

      /* NEW: Savings Calculator */
      const SavingsCalculator = () => {
        const [hours,setHours] = React.useState(10);
        const hourly = 750; // AED
        const traditional = hours * hourly;
        // Assume Growth plan as reference
        const retainer = 1999;
        const savingsPct = Math.max(0, Math.round((traditional - retainer) / Math.max(traditional,1) * 100));
        return (
          <Section className="py-12">
            <div data-reveal className="max-w-3xl mx-auto bg-white border border-slate-200 rounded-2xl shadow-soft p-6 text-center">
              <h3 className="text-2xl font-extrabold poppins text-slate-900">See How Much You Can Save</h3>
              <p className="text-slate-600 mt-1">Estimate based on average UAE firm rate of AED {hourly}/hour.</p>
              <div className="mt-5">
                <input type="range" min="5" max="60" value={hours} onChange={e=>setHours(+e.target.value)} className="w-full accent-purple-600" />
                <p className="text-sm text-slate-600 mt-1">{hours} hours / month</p>
              </div>
              <div className="grid sm:grid-cols-3 gap-3 mt-4">
                <div className="border rounded-lg p-3">
                  <p className="font-semibold">Traditional Firm</p>
                  <p className="text-lg text-rose-600">AED {traditional.toLocaleString()}</p>
                </div>
                <div className="border rounded-lg p-3">
                  <p className="font-semibold">Online Legal UAE</p>
                  <p className="text-lg text-emerald-600">AED {retainer.toLocaleString()}</p>
                </div>
                <div className="border rounded-lg p-3">
                  <p className="font-semibold">Estimated Savings</p>
                  <p className="text-lg" style={{color:'#7B2FF7'}}>{savingsPct}%</p>
                </div>
              </div>
              <div className="mt-4">
                <a href="#plans" className="inline-block rounded-lg px-4 py-2 text-white btn-glow" style={{background: BRAND.accent}}>Book Your Retainer & Save</a>
              </div>
            </div>
          </Section>
        );
      };

      /* NEW: Blog / Insights */
      const BlogInsights = () => {
        const posts = [
          {t:'New UAE Corporate Law Updates (2025)', d:'Key changes every SME should know before renewing contracts.', link:'#'},
          {t:'How Retainers Cut Legal Costs for SMEs', d:'A practical guide with real examples from UAE businesses.', link:'#'},
          {t:'Digital Transformation of Legal Services', d:'Why integrated CRM + video + docs is the new normal.', link:'#'},
        ];
        return (
          <Section className="py-12">
            <div data-reveal className="text-center mb-6">
              <h3 className="text-2xl font-extrabold poppins text-slate-900">Legal Insights & Updates</h3>
              <p className="text-slate-600">Expert articles for UAE businesses and individuals.</p>
            </div>
            <div className="grid sm:grid-cols-3 gap-4">
              {posts.map((p,i)=>(
                <div key={i} data-reveal className="p-5 bg-white border border-slate-200 rounded-2xl shadow-soft">
                  <h4 className="font-semibold mb-2">{p.t}</h4>
                  <p className="text-sm text-slate-600 mb-3">{p.d}</p>
                  <a href={p.link} className="text-sm font-medium" style={{color:'#6B21A8'}}>Read More →</a>
                </div>
              ))}
            </div>
          </Section>
        );
      };

      const FAQ = () => {
        const items = [
          {q:'How does the retainer work?', a:'Choose a monthly plan. Track hours, book meetings, and share documents in your dashboard.'},
          {q:'Can I switch plans?', a:'Yes, upgrade/downgrade anytime. Hours reset monthly for fairness.'},
          {q:'Do you offer one-time services?', a:'Yes — instant consultations and fixed-fee services are available.'},
          {q:'Is my data secure?', a:'Yes. Encrypted storage and UAE-hosted infrastructure.'},
        ];
        const [open, setOpen] = React.useState(0);
        return (
          <div data-reveal className="rounded-2xl border border-slate-200 bg-white shadow-soft divide-y">
            {items.map((it, i)=>(
              <details key={i} open={open===i} onToggle={(e)=> setOpen(e.target.open? i : -1)}>
                <summary className="cursor-pointer select-none px-4 py-3 font-medium text-slate-800">{it.q}</summary>
                <div className="px-4 pb-4 text-sm text-slate-600">{it.a}</div>
              </details>
            ))}
          </div>
        );
      };

      const ContactModal = ({open, onClose, prefillPlan}) => {
        const [name,setName]=React.useState('');
        const [email,setEmail]=React.useState('');
        const [msg,setMsg]=React.useState('');
        const [company,setCompany]=React.useState('');
        const [phone,setPhone]=React.useState('');
        const [plan,setPlan]=React.useState(prefillPlan||'');
        const [more,setMore]=React.useState(false);

        React.useEffect(()=>{ setPlan(prefillPlan||''); },[prefillPlan]);
        if(!open) return null;

        function submit(e){
          e.preventDefault();
          const payload = { name, email, message: msg, company, phone, plan: plan||prefillPlan };
          console.log('Lead Submitted', payload);
          alert('Thank you! Our team will contact you shortly.');
          onClose();
        }

        return (
          <div className="fixed inset-0 z-50 grid place-items-center bg-black/40 p-4" role="dialog" aria-modal="true">
            <div className="w-full max-w-lg rounded-2xl bg-white shadow-soft border border-slate-200 chat-pop">
              <div className="px-5 py-4 border-b border-slate-200 flex items-center justify-between">
                <h3 className="font-semibold text-slate-900 poppins">Book a Free Consultation</h3>
                <button onClick={onClose} className="text-slate-500 hover:text-slate-700">✕</button>
              </div>
              <form onSubmit={submit} className="p-5 space-y-3">
                <div className="grid sm:grid-cols-2 gap-3">
                  <input required value={name} onChange={e=>setName(e.target.value)} placeholder="Name" className="border border-slate-300 rounded-md px-3 py-2 text-sm" />
                  <input required type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="Email" className="border border-slate-300 rounded-md px-3 py-2 text-sm" />
                </div>
                <textarea required value={msg} onChange={e=>setMsg(e.target.value)} placeholder="Tell us briefly about your legal need" className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm min-h-[96px]"></textarea>

                <button type="button" onClick={()=>setMore(!more)} className="text-sm underline" style={{color: BRAND.accent}}>
                  {more ? 'Hide additional details' : 'Add company / phone / plan'}
                </button>

                {more && (
                  <div className="grid sm:grid-cols-2 gap-3">
                    <input value={company} onChange={e=>setCompany(e.target.value)} placeholder="Company (optional)" className="border border-slate-300 rounded-md px-3 py-2 text-sm" />
                    <input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="Phone (optional)" className="border border-slate-300 rounded-md px-3 py-2 text-sm" />
                    <select value={plan} onChange={e=>setPlan(e.target.value)} className="border border-slate-300 rounded-md px-3 py-2 text-sm sm:col-span-2">
                      <option value="">Plan Selected (optional)</option>
                      <option>Starter</option>
                      <option>Growth</option>
                      <option>Corporate</option>
                    </select>
                  </div>
                )}

                <div className="pt-2 flex gap-2">
                  <button className="rounded-md px-4 py-2 text-white btn-glow" style={{background: BRAND.accent}}>Submit</button>
                  <button type="button" onClick={onClose} className="rounded-md px-4 py-2 border border-slate-300">Cancel</button>
                </div>
              </form>
            </div>
          </div>
        );
      };

      /* Floating Chat Button */
      const FloatingChat = ({onOpen}) => (
        <button onClick={onOpen} className="fixed bottom-5 right-5 rounded-full p-4 text-white shadow-lg btn-glow" style={{background:'#6B21A8'}} aria-label="Chat with Legal Assistant">💬</button>
      );

      function App(){
        const [modal, setModal] = React.useState(false);
        const [prefillPlan, setPrefillPlan] = React.useState('');
        const [chatOpen, setChatOpen] = React.useState(false);

        const plans = [
          {
            name:'Starter',
            price:'AED 999/mo',
            badge:'For individuals & startups',
            features:[
              '2 consultations (30m each)',
              'Basic doc review (up to 5 pages)',
              'Email support (48h response)',
              'Discounted hourly rates'
            ],
            cta:'Start Starter Plan'
          },
          {
            name:'Growth',
            price:'AED 1,999/mo',
            badge:'Best Value for SMEs',
            highlight:true,
            features:[
              '4 consultations (45m each)',
              'Drafting – 2 simple agreements',
              'Priority email & WhatsApp (24h)',
              '1 dispute advisory / month'
            ],
            cta:'Start Growth Plan'
          },
          {
            name:'Corporate',
            price:'AED 3,999/mo',
            badge:'For teams 25+ staff',
            features:[
              'Unlimited consultations (fair use)',
              'Drafting & review (reasonable use)',
              'Dedicated account manager',
              'Board / shareholder support'
            ],
            cta:'Start Corporate Plan'
          },
        ];

        function openModal(plan){ setPrefillPlan(plan||''); setModal(true); }

        React.useEffect(()=>{
          // simple scroll-reveal
          const els = Array.from(document.querySelectorAll('[data-reveal]'));
          const io = new IntersectionObserver((entries)=>{
            entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} });
          }, { threshold: 0.08 });
          els.forEach(el=>{ el.classList.add('reveal'); io.observe(el); });
          return ()=> io.disconnect();
        },[]);

        return (
          <div className="min-h-screen">
            {/* Header */}
            <header className="bg-white border-b border-slate-200">
              <Section className="h-16 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="h-9 w-9 rounded-xl" style={{background: BRAND.gradient}}></div>
                  <div>
                    <p className="text-sm font-semibold poppins" style={{color:'#111827'}}>Online Legal UAE</p>
                    <p className="text-[12px] text-slate-500">UAE’s First Integrated Legal Tech Portal</p>
                  </div>
                </div>
                <div className="flex items-center gap-2 text-sm">
                  <a href="#plans" className="px-3 py-1.5 rounded-md border border-slate-300 hover:bg-slate-50">Plans</a>
                  <a href="#features" className="px-3 py-1.5 rounded-md border border-slate-300 hover:bg-slate-50">Features</a>
                  <a href="#faq" className="px-3 py-1.5 rounded-md border border-slate-300 hover:bg-slate-50">FAQ</a>
                  <button onClick={()=>openModal('')} className="px-3 py-1.5 rounded-md text-white hover:opacity-95 btn-glow" style={{background: BRAND.accent}}>Talk to a Lawyer Now</button>
                </div>
              </Section>
            </header>

            {/* Hero */}
            <div className="gradient-bg text-white">
              <Section className="py-14">
                <div className="grid md:grid-cols-2 gap-8 items-center">
                  <div>
                    <h1 className="text-4xl md:text-5xl font-extrabold poppins leading-tight">Your Legal Department, <span className="opacity-90">Simplified.</span></h1>
                    <p className="mt-3 text-white/90 text-lg">Hire verified UAE lawyers for consultations and monthly retainers. Manage meetings, documents, hours, and invoices in one secure portal.</p>
                    <div className="mt-6 flex flex-wrap gap-3">
                      <button onClick={()=>openModal('')} className="rounded-lg px-5 py-3 text-sm font-semibold text-white shadow-lg hover:shadow-xl btn-glow" style={{background:'#6B21A8'}}>Book a Free Consultation</button>
                      <a href="#plans" className="rounded-lg px-5 py-3 text-sm font-semibold bg-white/10 hover:bg-white/20 border border-white/30">View Retainer Plans</a>
                    </div>
                    <div className="mt-4 flex flex-wrap items-center gap-4 text-sm text-white/90">
                      <span className="inline-flex items-center gap-2"><span>🔒</span>Encrypted UAE Hosting</span>
                      <span className="inline-flex items-center gap-2"><span>🎥</span>Built-in Video Meetings</span>
                      <span className="inline-flex items-center gap-2"><span>🧾</span>Transparent Pricing</span>
                    </div>
                  </div>
                  <div className="rounded-2xl bg-white/10 border border-white/20 p-6">
                    <h3 className="font-semibold">What you get</h3>
                    <ul className="mt-3 space-y-2 text-white/90">
                      <li>✔ Dedicated CRM (hours, tasks, invoices)</li>
                      <li>✔ Secure document vault & e-sign</li>
                      <li>✔ Smart calendar & booking</li>
                      <li>✔ Bilingual support (Arabic & English)</li>
                    </ul>
                  </div>
                </div>
              </Section>
            </div>

            {/* Plans */}
            <Section id="plans" className="py-12">
              <div className="text-center mb-8">
                <h2 className="text-3xl font-extrabold poppins text-slate-900">Choose Your Retainer</h2>
                <p className="text-slate-600">Simple monthly plans for individuals, startups, and enterprises.</p>
              </div>
              <div className="grid md:grid-cols-3 gap-6">
                {plans.map(p => <PlanCard key={p.name} plan={p} onSelect={openModal} />)}
              </div>
            </Section>

            {/* Why Choose Us */}
            <Section id="features" className="py-10">
              <div className="text-center mb-8">
                <h3 className="text-3xl font-extrabold poppins text-slate-900">Why Choose Online Legal UAE</h3>
                <p className="text-slate-600">Built for UAE businesses and professionals who demand speed, clarity, and security.</p>
              </div>
              <FeatureGrid/>
            </Section>

            {/* NEW: Trust & Authority Section */}
            <TrustSection/>

            {/* Comparison */}
            <Section className="py-12">
              <div className="text-center mb-8">
                <h3 className="text-3xl font-extrabold poppins text-slate-900">How We Compare</h3>
                <p className="text-slate-600">The only UAE portal combining CRM, video, calendar, and secure docs — all-in-one.</p>
              </div>
              <ComparisonTable/>
            </Section>

            {/* NEW: Savings Calculator (after comparison) */}
            <SavingsCalculator/>

            {/* Testimonials */}
            <Section className="py-12">
              <div className="grid md:grid-cols-2 gap-6">
                <div data-reveal className="rounded-2xl border border-slate-200 bg-white p-6 shadow-soft">
                  <p className="text-slate-700">“We moved all corporate retainers here. Transparent, fast, and our team loves the dashboard.”</p>
                  <p className="mt-2 text-sm font-medium">— Ahmed Al Noor, CEO, Noor Trading LLC</p>
                </div>
                <div data-reveal className="rounded-2xl border border-slate-200 bg-white p-6 shadow-soft">
                  <p className="text-slate-700">“The integrated CRM and video meetings made legal work effortless for our HR and finance.”</p>
                  <p className="mt-2 text-sm font-medium">— Fatima Khan, HR Head, Gulf SME</p>
                </div>
              </div>
            </Section>

            {/* NEW: Blog / Insights */}
            <BlogInsights/>
